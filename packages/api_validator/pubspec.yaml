name: api_validator
description: >-
  Validate API requests and responses against your OpenAPI (Swagger) spec in
  Dart and Flutter tests. Catch stale mocks, bad requests and untested endpoints.
version: 1.0.0
repository: https://github.com/mohammad19169/api_validator/tree/main/packages/api_validator
issue_tracker: https://github.com/mohammad19169/api_validator/issues
topics:
  - api
  - openapi
  - swagger
  - validation
  - testing
resolution: workspace

environment:
  sdk: ^3.8.0

executables:
  api_validator: api_validator

dependencies:
  args: ^2.6.0
  collection: ^1.19.0
  glob: ^2.1.2
  meta: ^1.16.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.15
