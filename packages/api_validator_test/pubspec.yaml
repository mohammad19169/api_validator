  - openapi
  - swagger
  - testing
  - matcher
resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  api_validator: ^1.0.0
  matcher: ^0.12.17
  meta: ^1.16.0
  test_api: ">=0.7.0 <0.8.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.15
