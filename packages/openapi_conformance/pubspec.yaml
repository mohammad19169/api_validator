name: openapi_conformance
description: >-
  Validate HTTP traffic in your Dart and Flutter tests against an OpenAPI 3.0/3.1
  spec. Catch stale mocks, invalid requests and untested endpoints.
version: 1.0.0
repository: https://github.com/mohammad19169/openapi_conformance/tree/main/packages/openapi_conformance
issue_tracker: https://github.com/mohammad19169/openapi_conformance/issues
topics:
  - openapi
  - testing
  - http
  - contract-testing
  - mock
resolution: workspace

environment:
  sdk: ^3.8.0

executables:
  openapi_conformance: openapi_conformance

dependencies:
  args: ^2.6.0
  collection: ^1.19.0
  glob: ^2.1.2
  meta: ^1.16.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.15
