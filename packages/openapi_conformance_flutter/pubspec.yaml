name: openapi_conformance_flutter
description: >-
  Debug overlay for Flutter apps that lists API calls and shows which
  responses break your OpenAPI spec, field by field.
version: 1.0.1
repository: https://github.com/mohammad19169/openapi_conformance/tree/main/packages/openapi_conformance_flutter
issue_tracker: https://github.com/mohammad19169/openapi_conformance/issues
topics:
  - openapi
  - debugging
  - network
  - inspector
  - testing
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  openapi_conformance: ^1.0.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
